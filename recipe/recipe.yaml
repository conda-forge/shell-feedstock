context:
  version: "0.3.0"

package:
  name: shell
  version: ${{ version }}

source:
  url: https://github.com/prefix-dev/shell/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 38e22fa64a23d3f94e9fcc8fec29995d09005fd06da9cbb65a6bbb2f42bda37f

build:
  number: 0
  script: |
    set -ex
    cd crates/shell
    cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    cargo install --no-track --locked --bins --root ${{ PREFIX }} --path .

requirements:
  build:
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - shell --help

about:
  homepage: https://github.com/prefix-dev/shell
  license: MIT
  license_file:
    - crates/shell/THIRDPARTY.yml
    - LICENSE.txt
  summary: The ultimate cross-platform, bash-like shell

extra:
  recipe-maintainers:
    - certik
    - prsabahrami
    - wolfv
